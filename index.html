<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Spark Dodge</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e2229; color: #e8f1f2;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif; overflow: hidden; touch-action: none; }
  #wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { background: #12303a; border-radius: 10px; max-width: 100%; max-height: 100%;
    box-shadow: 0 0 0 2px #1d4552; cursor: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="720"></canvas></div>
<script>
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const COL = { spark: "#ffd23f", bad: "#ff5a5f", good: "#7fe0c3", text: "#e8f1f2", dim: "#7aa3ad" };

let state = "title", score, lives, combo, t, spawnT, items, parts, shake, best = 0;
try { best = +localStorage.getItem("sparkdodge-best") || 0; } catch (e) {}
const p = { x: W / 2, y: H - 90, r: 14, tx: W / 2, ty: H - 90 };
const keys = {};

function reset() {
  score = 0; lives = 3; combo = 0; t = 0; spawnT = 0; items = []; parts = []; shake = 0;
  p.x = p.tx = W / 2; p.y = p.ty = H - 90;
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = 40 + Math.random() * 160;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, color });
  }
}

function spawn() {
  const good = Math.random() < 0.3;
  const size = good ? 11 : 16 + Math.random() * 26;
  items.push({
    x: size + Math.random() * (W - size * 2), y: -size,
    w: size, good, vy: (good ? 150 : 170) + Math.min(t * 6, 260) + Math.random() * 60,
    vx: good ? 0 : (Math.random() - 0.5) * Math.min(t * 3, 90)
  });
}

function end() {
  state = "over";
  if (score > best) { best = score; try { localStorage.setItem("sparkdodge-best", best); } catch (e) {} }
}

function update(dt) {
  t += dt;
  const sp = 340 * dt;
  if (keys.ArrowLeft || keys.a) p.tx -= sp;
  if (keys.ArrowRight || keys.d) p.tx += sp;
  if (keys.ArrowUp || keys.w) p.ty -= sp;
  if (keys.ArrowDown || keys.s) p.ty += sp;
  p.tx = Math.max(p.r, Math.min(W - p.r, p.tx));
  p.ty = Math.max(H * 0.4, Math.min(H - p.r, p.ty));
  p.x += (p.tx - p.x) * Math.min(1, dt * 18);
  p.y += (p.ty - p.y) * Math.min(1, dt * 18);

  spawnT -= dt;
  if (spawnT <= 0) { spawn(); spawnT = Math.max(0.22, 0.7 - t * 0.008); }

  for (const it of items) {
    it.y += it.vy * dt; it.x += it.vx * dt;
    if (it.x < it.w || it.x > W - it.w) it.vx *= -1;
    const hit = it.good
      ? Math.hypot(it.x - p.x, it.y - p.y) < it.w + p.r
      : Math.abs(it.x - p.x) < it.w + p.r * 0.7 && Math.abs(it.y - p.y) < it.w + p.r * 0.7;
    if (hit) {
      it.dead = true;
      if (it.good) {
        combo++; score += 10 * Math.min(combo, 8);
        burst(it.x, it.y, COL.good, 10);
      } else {
        lives--; combo = 0; shake = 0.3;
        burst(p.x, p.y, COL.bad, 24);
        if (lives <= 0) end();
      }
    } else if (it.y > H + 50) {
      it.dead = true;
      if (it.good) combo = 0;
      else score += 1;
    }
  }
  items = items.filter(i => !i.dead);
  for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  parts = parts.filter(q => q.life > 0);
  shake = Math.max(0, shake - dt);
}

function text(s, x, y, size, color, align) {
  ctx.fillStyle = color; ctx.font = "bold " + size + "px 'Trebuchet MS', 'Segoe UI', sans-serif";
  ctx.textAlign = align || "center"; ctx.fillText(s, x, y);
}

function draw() {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);

  for (const it of items) {
    if (it.good) {
      ctx.fillStyle = COL.good; ctx.beginPath(); ctx.arc(it.x, it.y, it.w, 0, 6.283); ctx.fill();
    } else {
      ctx.fillStyle = COL.bad; ctx.fillRect(it.x - it.w, it.y - it.w, it.w * 2, it.w * 2);
    }
  }
  for (const q of parts) {
    ctx.globalAlpha = Math.max(0, q.life * 2);
    ctx.fillStyle = q.color; ctx.fillRect(q.x - 2, q.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  if (state === "play") {
    ctx.shadowColor = COL.spark; ctx.shadowBlur = 18;
    ctx.fillStyle = COL.spark; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    ctx.shadowBlur = 0;
  }

  if (state !== "title") {
    text("Score " + score, 16, 34, 22, COL.text, "left");
    text("Best " + best, W - 16, 34, 16, COL.dim, "right");
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < lives ? COL.spark : "#24505d";
      ctx.beginPath(); ctx.arc(24 + i * 26, 60, 8, 0, 6.283); ctx.fill();
    }
    if (combo > 1) text("x" + Math.min(combo, 8) + " combo", W / 2, 34, 18, COL.good);
  }

  if (state === "title" || state === "over") {
    ctx.fillStyle = "rgba(14,34,41,0.82)"; ctx.fillRect(0, 0, W, H);
    text(state === "title" ? "Spark Dodge" : "Game over", W / 2, 250, 46, COL.spark);
    if (state === "over") {
      text("Score " + score, W / 2, 305, 26, COL.text);
      text(score >= best && score > 0 ? "New best" : "Best " + best, W / 2, 340, 18, COL.good);
    } else {
      text("Catch the green orbs. Dodge the red blocks.", W / 2, 305, 17, COL.text);
      text("Chain orbs without missing one to build a combo.", W / 2, 332, 15, COL.dim);
    }
    text(state === "title" ? "Press Space or tap to start" : "Press Space or tap to play again", W / 2, 420, 20, COL.text);
    text("Move: mouse, touch drag, arrows or WASD", W / 2, 455, 15, COL.dim);
    text("P pauses", W / 2, 480, 15, COL.dim);
  }
  if (state === "pause") {
    ctx.fillStyle = "rgba(14,34,41,0.7)"; ctx.fillRect(0, 0, W, H);
    text("Paused", W / 2, H / 2, 40, COL.text);
  }
  ctx.restore();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === "play") update(dt);
  else if (state === "over") {
    for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
    parts = parts.filter(q => q.life > 0);
  }
  draw();
  requestAnimationFrame(loop);
}

function start() { reset(); state = "play"; }
function point(e) {
  const r = cv.getBoundingClientRect(), s = e.touches ? e.touches[0] : e;
  p.tx = (s.clientX - r.left) * (W / r.width);
  p.ty = (s.clientY - r.top) * (H / r.height) - (e.touches ? 40 : 0);
}

addEventListener("keydown", e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = true;
  if (e.key === " ") { e.preventDefault(); if (state !== "play" && state !== "pause") start(); }
  if (k === "p") state = state === "play" ? "pause" : state === "pause" ? "play" : state;
});
addEventListener("keyup", e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
cv.addEventListener("mousemove", e => { if (state === "play") point(e); });
cv.addEventListener("mousedown", () => { if (state === "title" || state === "over") start(); });
cv.addEventListener("touchstart", e => { if (state === "title" || state === "over") start(); else point(e); }, { passive: true });
cv.addEventListener("touchmove", e => { if (state === "play") point(e); }, { passive: true });

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
